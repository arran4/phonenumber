# Temporary updater for the November 2026 dependency refresh.
# Remove this file from the PR after the generated module changes are committed.
name: One-time dependency refresh
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.head_ref == 'maintenance/refresh-all-dependencies-20261115' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev build-essential xvfb
      - name: Upgrade all packages and tidy the module graph
        shell: bash
        run: |
          set -euo pipefail
          go get -u ./...
          go mod tidy
          go mod verify
          git diff -- go.mod go.sum
      - name: Test dependency upgrades before committing
        run: xvfb-run --auto-servernum go test ./...
      - name: Commit refreshed module files onto this pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo 'All used Go modules were already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): upgrade Go module dependencies and tidy sums'
          git push origin HEAD:refs/heads/maintenance/refresh-all-dependencies-20261115
